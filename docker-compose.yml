services:
  api:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: "8080"
      DATA_DIR: /data
      JWT_SECRET: ${JWT_SECRET:-sonora-dev-secret-change-me}
    volumes:
      - sonora_data:/data
    ports:
      - "127.0.0.1:8096:8080"
    networks:
      hosting:
        aliases:
          - sonora-api
    restart: unless-stopped

volumes:
  sonora_data:

networks:
  hosting:
    external: true
    name: hosting_default
