services:
  api:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: "8080"
    ports:
      - "127.0.0.1:8096:8080"
    networks:
      hosting:
        aliases:
          - sonora-api
    restart: unless-stopped

networks:
  hosting:
    external: true
    name: hosting_default
